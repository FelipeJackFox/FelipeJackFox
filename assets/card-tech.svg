  <text x="20" y="70" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#7aa2f7">~/.config</tspan><tspan fill="#bb9af7"> ❯ </tspan><tspan fill="#c0caf5">cat tech-stack.toml</tspan></text>

  <text x="20" y="106" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13" fill="#565f89">  # 8 packages · curated stack</text>

