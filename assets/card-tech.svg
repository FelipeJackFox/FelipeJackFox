  <text x="20" y="230" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#c0caf5">  kotlin  </tspan><tspan fill="#565f89">= </tspan><tspan fill="#9ece6a">"mobile"</tspan></text>

