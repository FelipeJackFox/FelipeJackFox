<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0" />
      <stop offset="50%" style="stop-color:#f1f5f9" />
      <stop offset="100%" style="stop-color:#cbd5e1" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="190" fill="url(#bg)" rx="6"/>

  <!-- Subtle dot grid -->
  <g opacity="0.04">
    <circle cx="40" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="120" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="200" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="280" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="360" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="440" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="520" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="600" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="680" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="760" cy="40" r="0.8" fill="#f1f5f9"/>
    <circle cx="40" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="120" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="200" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="280" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="360" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="440" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="520" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="600" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="680" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="760" cy="95" r="0.8" fill="#f1f5f9"/>
    <circle cx="40" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="120" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="200" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="280" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="360" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="440" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="520" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="600" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="680" cy="150" r="0.8" fill="#f1f5f9"/>
    <circle cx="760" cy="150" r="0.8" fill="#f1f5f9"/>
  </g>

  <!-- Floating accent particles -->
  <circle cx="700" cy="45" r="1.2" fill="#38bdf8" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="145" r="1" fill="#a78bfa" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="140" r="0.8" fill="#a78bfa" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="50" r="1" fill="#38bdf8" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom accent line -->
  <rect y="185" width="800" height="2" fill="url(#line)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Name -->
  <text x="400" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="300" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="6">
    Felipe Pacheco
  </text>

  <!-- Subtitle -->
  <text x="400" y="115" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="3">
    AI  &amp;  Robotics  //  Mathematics
  </text>

  <!-- Accent dot between sections -->
  <circle cx="400" cy="140" r="2" fill="#38bdf8" opacity="0.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Location line -->
  <text x="400" y="165" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="2">
    Queretaro, Mexico
  </text>
</svg>
