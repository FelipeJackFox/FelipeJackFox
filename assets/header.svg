<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f0f0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e0e0" />
      <stop offset="50%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#a0a0b0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#grad)" rx="8"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="40" x2="800" y2="40" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="200" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Animated accent line -->
  <rect y="195" width="800" height="2" fill="url(#lineGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Small floating dots -->
  <circle cx="680" cy="50" r="1.5" fill="#4a9eff" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="150" r="1" fill="#4a9eff" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="130" r="1.2" fill="#4a9eff" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="1" fill="#4a9eff" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Name -->
  <text x="400" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="300" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">
    Felipe Pacheco
  </text>

  <!-- Tagline with typing animation -->
  <text x="400" y="125" font-family="'Courier New', monospace" font-size="14" fill="#4a9eff" text-anchor="middle" letter-spacing="2" filter="url(#glow)">
    AI &amp; Robotics  //  Mathematics  //  Building the future
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Blinking cursor -->
  <rect x="598" y="113" width="8" height="16" fill="#4a9eff" opacity="0.8">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Top accent line -->
  <rect y="3" width="800" height="1" fill="url(#lineGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
