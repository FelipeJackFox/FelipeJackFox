  <text x="20" y="306" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#3760bf">  tensorflow </tspan><tspan fill="#848cb5">= </tspan><tspan fill="#587539">"supervised"</tspan></text>

