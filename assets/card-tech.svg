  <text x="20" y="164" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#c0caf5">  python  </tspan><tspan fill="#565f89">= </tspan><tspan fill="#9ece6a">"primary"</tspan></text>
  <text x="20" y="186" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#c0caf5">  cpp     </tspan><tspan fill="#565f89">= </tspan><tspan fill="#9ece6a">"intermediate"</tspan></text>
