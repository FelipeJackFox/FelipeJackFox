<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cbd5e1" />
      <stop offset="50%" style="stop-color:#f1f5f9" />
      <stop offset="100%" style="stop-color:#cbd5e1" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#64748b;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="800" height="180" fill="url(#bg)" rx="6"/>

  <!-- Thin separator line -->
  <rect y="175" width="800" height="1" fill="url(#line)"/>

  <!-- Name -->
  <text x="400" y="75" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="300" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="6">
    Felipe Pacheco
  </text>

  <!-- Subtitle -->
  <text x="400" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="300" fill="#94a3b8" text-anchor="middle" letter-spacing="3">
    AI  &amp;  Robotics  //  Mathematics
  </text>

  <!-- Location -->
  <text x="400" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="2">
    Queretaro, Mexico
  </text>
</svg>
