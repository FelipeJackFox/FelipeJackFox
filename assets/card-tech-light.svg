  <text x="784" y="24" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#848cb5" text-anchor="middle">×</text>

  <text x="20" y="70" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#2e7de9">~/.config</tspan><tspan fill="#9854f1"> ❯ </tspan><tspan fill="#3760bf">cat tech-stack.toml</tspan></text>

  <text x="20" y="106" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13" fill="#848cb5">  # 8 packages · curated stack</text>

