  <text x="20" y="164" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#3760bf">  python  </tspan><tspan fill="#848cb5">= </tspan><tspan fill="#587539">"primary"</tspan></text>
  <text x="20" y="186" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#3760bf">  cpp     </tspan><tspan fill="#848cb5">= </tspan><tspan fill="#587539">"intermediate"</tspan></text>
  <text x="20" y="208" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#3760bf">  r       </tspan><tspan fill="#848cb5">= </tspan><tspan fill="#587539">"applied stats"</tspan></text>
  <text x="20" y="230" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13"><tspan fill="#3760bf">  kotlin  </tspan><tspan fill="#848cb5">= </tspan><tspan fill="#587539">"mobile"</tspan></text>

  <text x="20" y="262" font-family="'SF Mono', Menlo, 'Cascadia Code', 'Courier New', monospace" font-size="13" fill="#f52a65">[ml]</text>
